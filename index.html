<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CDCD</title>

<!-- 레트로 폰트 (VT323 은 한글이 없어서 한글은 시스템 폰트로 대체됩니다) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

<style>
  /* =========================================================
   * 1. 디자인 토큰
   * ========================================================= */
  :root {
    --neon: #39ff14;
    --neon-dim: #1c8a0a;
    --lcd-bg: #020a02;
    --chrome-hi: #d4d0c8;
    --room-top: #1a1030;
    --room-bottom: #05030c;
    --font-retro: "VT323", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    font-family: var(--font-retro);
    color: var(--neon);
    background:
      radial-gradient(ellipse at 50% 0%, #3a1f6e 0%, transparent 60%),
      linear-gradient(180deg, var(--room-top), var(--room-bottom));
    display: flex; justify-content: center;
    padding: 28px 12px 40px;
  }
  button { font-family: var(--font-retro); }

  /* =========================================================
   * 2. 유튜브 플레이어 (화면에서는 안 보이게)
   *    - display:none / 1px 크기 / 화면 밖(-9999px) 은 재생이 막힐 수 있어서
   *      "200x200 크기로 화면 안 구석에 두고 투명도만 거의 0" 으로 숨깁니다.
   * ========================================================= */
  #yt-holder {
    position: fixed; right: 0; bottom: 0;
    width: 200px; height: 200px;
    opacity: 0.01; pointer-events: none; z-index: -1; overflow: hidden;
  }

  /* =========================================================
   * 3. 윈앰프 본체 (윈도우 95/98 베벨)
   * ========================================================= */
  .winamp {
    width: min(380px, 100%);
    height: fit-content;
    background: linear-gradient(180deg, #3b3b46, #24242c);
    border: 2px solid; border-color: #6e6e7c #101014 #101014 #6e6e7c;
    box-shadow: 0 16px 40px rgba(0,0,0,.6);
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    margin: 3px 3px 0; padding: 3px 6px;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff; font-size: 20px; letter-spacing: 2px;
    /* 바벨&엠보스: 튀어나온 띠 (좌상단 빛 → 위/왼쪽 밝게, 아래/오른쪽 어둡게) */
    box-shadow:
      inset 1px 1px 0 rgba(255,255,255,.7), inset 2px 2px 0 rgba(255,255,255,.22),
      inset -1px -1px 0 rgba(0,0,0,.8), inset -2px -2px 0 rgba(0,0,0,.32),
      0 1px 0 rgba(255,255,255,.12);
  }
  .titlebar .ttl { text-shadow: 1px 1px 0 #000, -1px -1px 0 rgba(255,255,255,.25); }
  /* 제목 양옆의 양각 줄무늬(그립) */
  .grip {
    flex: 1; height: 10px; opacity: .85;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.6) 0 1px, rgba(0,0,0,.65) 1px 2px);
  }
  .tb-btn {
    width: 24px; height: 22px; padding: 0; font-size: 16px; line-height: 1; color: #111;
    background: var(--chrome-hi); cursor: pointer;
    border: 2px solid; border-color: #fff #404040 #404040 #fff;
  }
  .tb-btn:active { border-color: #404040 #fff #fff #404040; }
  .body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }

  /* file:// 로 열었을 때 경고 */
  .env-warn {
    font-size: 18px; padding: 6px 8px; color: #ffd24a;
    background: #2a2200; border: 1px solid #7a6200;
  }
  .env-warn[hidden] { display: none; }

  /* ---- 윈앰프 안에 들어간 투명 CD 플레이어 ----
     구조: 본체(투명 플라스틱) > 홈 라인 > 원형 CD 슬롯(+손가락 홈) > CD(+띠, 빨간 마개)
     크기(본체 폭 기준): CD 슬롯 72% / CD 69% */
  .cd-panel {
    --r: 46px;         /* 본체 바깥 모서리 */
    --r-rim: 26px;     /* 홈 라인 모서리: 바깥(46) - 안으로 들어간 거리(약 20px) = 동심 */
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    border-radius: var(--r); overflow: hidden;
    background: linear-gradient(145deg, rgba(200,180,255,.38), rgba(80,60,150,.5)), #1a1236;
    box-shadow: 0 0 0 2px rgba(8,6,20,.9), 0 12px 30px rgba(0,0,0,.55);
  }
  /* 앨범 커버: 사각형 본체 전체에 깔림, 회전 안 함, 불투명도 75% */
  .cd-bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: .75; visibility: hidden; z-index: 0;
  }
  /* 본체 바깥 가장자리: 투명 플라스틱의 두께감 */
  .cd-panel::before {
    content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: var(--r);
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.7),
      inset 3px 3px 6px rgba(255,255,255,.4),
      inset -3px -3px 8px rgba(0,0,0,.4);
  }
  /* 유리 반사광 (고정) */
  .cd-panel::after {
    content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none; border-radius: var(--r);
    background:
      linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.05) 30%, transparent 46%),
      linear-gradient(315deg, rgba(255,255,255,.12), transparent 28%);
  }

  /* 홈 라인: 1px 어두운 선 + 1px 밝은 선(1px 어긋나게)으로 가늘게 파인 홈 표현 */
  .cd-rim {
    position: absolute; inset: 5.5%; z-index: 3; pointer-events: none; border-radius: var(--r-rim);
    border: 1px solid rgba(0,0,0,.30);
  }
  .cd-rim::before {
    content: ""; position: absolute; inset: -1px; border-radius: var(--r-rim);
    border: 1px solid rgba(255,255,255,.34); transform: translate(1px, 1px);
  }

  /* 슬롯/CD 의 위치를 잡아주는 투명 래퍼 (안쪽 음각 사각형은 제거됨) */
  .cd-field { position: absolute; inset: 10.95%; z-index: 1; display: grid; place-items: center; }

  /* CD 슬롯(원형 홈) + 우측 하단 손가락 홈(원): 하나의 도형으로 합쳐 SVG 로 그림 */
  .cd-recess { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .cd-well { width: 92.7%; aspect-ratio: 1 / 1; display: grid; place-items: center; }

  /* 원형 CD : 이전보다 2/3 수준으로 더 투명, 4초에 한 바퀴 */
  .cd {
    position: relative; width: 95.7%; aspect-ratio: 1 / 1; border-radius: 50%;
    background: conic-gradient(from 20deg, rgba(255,255,255,.13), rgba(140,170,255,.05), rgba(255,255,255,.17), rgba(200,150,255,.07), rgba(255,255,255,.13));
    border: 2px solid rgba(255,255,255,.27);
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 0 18px rgba(255,255,255,.11);
    animation: cd-spin 4s linear infinite;      /* 항상 걸어두고 */
    animation-play-state: paused;               /* 멈춘 상태로 시작 */
    will-change: transform;
  }
  .cd.spinning { animation-play-state: running; }   /* PLAYING 일 때만 회전 */
  @keyframes cd-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* 방사형 빛 반사 (부드러운 그라데이션) */
  .cd::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0), rgba(255,255,255,.25) 8%, rgba(255,255,255,0) 20%,
      rgba(120,200,255,.16) 38%, rgba(255,255,255,0) 52%, rgba(255,255,255,.25) 70%, rgba(255,255,255,0) 84%);
    mix-blend-mode: screen; pointer-events: none;
  }
  /* CD 표면 장식(동심원, 띠)은 SVG 벡터 → 안티앨리어싱 적용. 투명도 2/3 */
  .cd-face { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: .67; }
  /* 빨간 마개: 방사형 빛 반사(::after) 위로 올라오도록 z-index 를 줌. CD 안에 있어서 같이 돈다 */
  .cd-cap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; pointer-events: none; }

  /* ---- 전광판 (LCD) ---- */
  .lcd {
    background: var(--lcd-bg);
    border: 2px solid; border-color: #101014 #6e6e7c #6e6e7c #101014;
    padding: 8px 10px; display: grid; grid-template-columns: 118px 1fr; gap: 10px;
    position: relative; overflow: hidden;
  }
  .lcd::after {  /* CRT 스캔라인 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  }
  .time {
    font-size: 50px; line-height: .95; letter-spacing: 2px; white-space: nowrap;
    text-shadow: 0 0 6px var(--neon), 0 0 16px rgba(57,255,20,.6);
  }
  .info { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .status { font-size: 18px; color: var(--neon-dim); display: flex; justify-content: space-between; gap: 6px; }
  .status b { color: var(--neon); font-weight: normal; text-shadow: 0 0 6px var(--neon); white-space: nowrap; }

  /* 흐르는 전광판 글씨
     JS 가 글자 폭/전광판 폭을 재서 --from, --to, --dur 를 넣어준다.
     글이 짧으면 .scroll 이 없어서 고정 표시 */
  .marquee { overflow: hidden; white-space: nowrap; font-size: 24px; text-shadow: 0 0 6px var(--neon); }
  .marquee span { display: inline-block; will-change: transform; }
  .marquee.scroll span { animation: marquee var(--dur, 10s) linear infinite; }
  @keyframes marquee {
    from { transform: translateX(var(--from, 0)); }
    to   { transform: translateX(var(--to, 0)); }
  }

  /* ---- 진행바 ---- */
  .seek {
    height: 10px; background: var(--lcd-bg); cursor: pointer;
    border: 2px solid; border-color: #101014 #6e6e7c #6e6e7c #101014;
  }
  .seek-fill { height: 100%; width: 0%; background: var(--neon); box-shadow: 0 0 8px var(--neon); }

  /* ---- 컨트롤 ---- */
  .controls { display: flex; gap: 6px; align-items: stretch; height: 30px; }   /* 납작한 한 줄 */
  .btn {
    flex: 1; height: 100%; padding: 0; display: flex; align-items: center; justify-content: center;
    color: #15141a; cursor: pointer;
    background: linear-gradient(180deg, #e6e3dc, #c6c2b9 55%, #b4b0a7);   /* 살짝 볼록한 키 */
    border: 1px solid #0b0b0f;
    /* 두꺼운 바벨: 바깥 3px(밝음/어두움) + 안쪽 단계 */
    box-shadow:
      inset 1px 1px 0 #fff, inset 3px 3px 0 rgba(255,255,255,.55),
      inset -1px -1px 0 #4a4740, inset -3px -3px 0 rgba(0,0,0,.28);
  }
  .btn svg { width: 16px; height: 12px; fill: currentColor; display: block; }
  /* 누른 상태 / 재생 중(래치) 상태: 바벨을 뒤집고 살짝 내려앉음 */
  .btn:active, .btn.latched {
    background: linear-gradient(180deg, #a9a59c, #bdb9b0);
    box-shadow:
      inset 1px 1px 0 #2f2d29, inset 3px 3px 0 rgba(0,0,0,.35),
      inset -1px -1px 0 #fff, inset -3px -3px 0 rgba(255,255,255,.5);
    padding-top: 2px;
  }
  .btn.latched { color: #0a5a0a; }
  .btn:focus-visible, .tb-btn:focus-visible { outline: 2px dashed var(--neon); outline-offset: 2px; }
  /* 옛날식 볼륨: 오른쪽으로 갈수록 점점 길어지는 세로 막대 (삼각형 모양) */
  .vol {
    width: 92px; display: flex; align-items: flex-end; gap: 2px; padding: 2px;
    background: var(--lcd-bg); cursor: pointer; touch-action: none; user-select: none;
    border: 3px solid; border-color: #101014 #8c8c9c #8c8c9c #101014;   /* 바벨 3px */
  }
  .vol i { flex: 1; background: #0e2a0b; box-shadow: inset 0 0 0 1px rgba(0,0,0,.45); pointer-events: none; }
  .vol i.on { background: var(--neon); box-shadow: 0 0 6px var(--neon); }
  .vol:focus-visible { outline: 2px dashed var(--neon); outline-offset: 2px; }

  .pl-select {
    width: 100%; font-family: var(--font-retro); font-size: 22px; padding: 2px 6px;
    color: var(--neon); background: var(--lcd-bg); cursor: pointer;
    border: 2px solid; border-color: #101014 #6e6e7c #6e6e7c #101014;
  }

  /* ---- 플레이리스트 ---- */
  .playlist {
    background: var(--lcd-bg); height: 220px; overflow-y: auto; font-size: 22px; user-select: none;
    border: 2px solid; border-color: #101014 #6e6e7c #6e6e7c #101014;
  }
  .playlist::-webkit-scrollbar { width: 14px; }
  .playlist::-webkit-scrollbar-track { background: #1a1a20; }
  .playlist::-webkit-scrollbar-thumb { background: var(--chrome-hi); border: 2px solid; border-color: #fff #404040 #404040 #fff; }
  .row { display: flex; gap: 8px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
  .row .no { color: var(--neon-dim); min-width: 28px; }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: rgba(57,255,20,.1); }
  .row.selected { background: rgba(57,255,20,.22); }
  .row.current { background: var(--neon); color: #021002; }
  .row.current .no { color: #021002; }
  .notice { padding: 12px; color: var(--neon-dim); }

  /* =========================================================
   * 4. 관리(CRUD) 창 — 윈도우 95 스타일
   * ========================================================= */
  .modal {
    position: fixed; inset: 0; z-index: 50; padding: 12px;
    background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center;
  }
  .modal[hidden] { display: none; }
  .win {
    width: min(720px, 100%); max-height: 92vh; display: flex; flex-direction: column;
    background: var(--chrome-hi); color: #111; font-size: 20px;
    border: 2px solid; border-color: #fff #404040 #404040 #fff;
  }
  .tabs { display: flex; gap: 2px; padding: 6px 6px 0; flex-wrap: wrap; }
  .tab {
    font-size: 20px; padding: 2px 12px; color: #111; background: #bdb9b0; cursor: pointer;
    border: 2px solid; border-color: #fff #404040 transparent #fff;
  }
  .tab.active { background: #fff; font-weight: bold; }
  .mgr-body {
    flex: 1; overflow: auto; margin: 0 6px 6px; padding: 10px; background: #c8c4bc;
    border: 2px solid; border-color: #404040 #fff #fff #404040;
  }
  .card { background: #d9d6cf; padding: 10px; margin-bottom: 10px; border: 1px solid #8a8780; }
  .card h3 { margin: 0 0 8px; font-size: 22px; font-weight: normal; }
  .fld { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .fld span { font-size: 18px; color: #333; }
  .fld input[type=text], .fld select {
    font-family: var(--font-retro); font-size: 20px; padding: 3px 6px; color: #111; background: #fff;
    border: 2px solid; border-color: #404040 #fff #fff #404040;
  }
  .img-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .thumb { width: 36px; height: 36px; object-fit: cover; background: #888; border: 1px solid #444; flex: none; }
  .thumb.big { width: 76px; height: 76px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .wbtn {
    font-size: 19px; padding: 2px 12px 3px; color: #111; background: var(--chrome-hi); cursor: pointer;
    border: 2px solid; border-color: #fff #404040 #404040 #fff;
  }
  .wbtn:active { border-color: #404040 #fff #fff #404040; }
  .wbtn:disabled { color: #888; cursor: default; }
  .wbtn.danger { color: #a00000; }
  .list { background: #fff; border: 2px solid; border-color: #404040 #fff #fff #404040; }
  .item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid #ccc; }
  .item.sel { background: #fff4b8; }
  .item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .item b { font-weight: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { color: #666; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .no { color: #666; min-width: 24px; }
  .empty { padding: 14px; color: #666; }
  .msg { margin-top: 8px; font-size: 18px; color: #0a5a0a; white-space: pre-wrap; }
  .msg.err { color: #b00000; }

  @media (prefers-reduced-motion: reduce) { .marquee.scroll span { animation: none; } }
</style>
</head>
<body>

<!-- 유튜브 IFrame API 가 이 div 를 iframe 으로 교체합니다 (화면에는 거의 투명) -->
<div id="yt-holder"><div id="yt-player"></div></div>

<!-- ================= 윈앰프 본체 (안에 CD 플레이어 포함) ================= -->
<main class="winamp" aria-label="Winamp style player">
  <div class="titlebar">
    <span class="grip"></span>
    <span class="ttl">CDCD</span>
    <span class="grip"></span>
    <button class="tb-btn" id="btn-manage" title="관리" aria-label="관리">⚙</button>
  </div>

  <div class="body">
    <div class="env-warn" id="env-warn" hidden>
      ⚠ 파일을 더블클릭(file://)으로 열면 유튜브 재생이 막힙니다.<br>
      VS Code Live Server 같은 로컬 서버(http://localhost)나 호스팅 주소로 열어주세요.
    </div>

    <!-- 투명 CD 플레이어: 본체 > 홈 라인 > 원형 슬롯(+손가락 홈) > CD(+띠, 빨간 마개) -->
    <section class="cd-panel" aria-label="CD player">
      <img class="cd-bg" id="cover" alt="앨범 커버" />
      <div class="cd-rim"></div>
      <div class="cd-field">
        <!-- 슬롯 원(반지름 46.35) + 우측 하단 손가락 홈(원)을 합친 음각 도형. 그림자는 반투명이라 뒤의 배경이 비쳐 보임 -->
        <svg class="cd-recess" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <filter id="cd-recess-f" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100" color-interpolation-filters="sRGB">
              <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
              <!-- 바닥: 아주 옅은 어두운 틴트 -->
              <feFlood flood-color="#0a0520" flood-opacity=".14" result="baseF"/>
              <feComposite in="baseF" in2="SourceAlpha" operator="in" result="base"/>
              <!-- 사방 가장자리에서 번지는 그림자 -->
              <feGaussianBlur in="inv" stdDeviation="3.2" result="invAmb"/>
              <feComposite in="invAmb" in2="SourceAlpha" operator="in" result="ambShade"/>
              <feFlood flood-color="#000" flood-opacity=".32" result="ambF"/>
              <feComposite in="ambF" in2="ambShade" operator="in" result="ambient"/>
              <!-- 좌상단에서 더 짙게 드리우는 그림자 -->
              <feGaussianBlur in="inv" stdDeviation="2.2" result="invBlurA"/>
              <feOffset in="invBlurA" dx="2.4" dy="2.4" result="invOffA"/>
              <feComposite in="invOffA" in2="SourceAlpha" operator="in" result="shadeA"/>
              <feFlood flood-color="#000" flood-opacity=".5" result="blackF"/>
              <feComposite in="blackF" in2="shadeA" operator="in" result="darkInner"/>
              <!-- 바깥 가장자리 선: 우하단은 밝게, 좌상단은 어둡게 -->
              <feOffset in="SourceAlpha" dx=".45" dy=".45" result="offHi"/>
              <feComposite in="offHi" in2="SourceAlpha" operator="out" result="hiEdge"/>
              <feFlood flood-color="#fff" flood-opacity=".45" result="hiF"/>
              <feComposite in="hiF" in2="hiEdge" operator="in" result="rimLight"/>

const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk";

/* 앨범 커버 업로드용 스토리지 버킷 이름 (Supabase Storage 에서 "Public bucket" 으로 만들어 두세요) */
const STORAGE_BUCKET = "album-covers";
/* 업로드 시 리사이즈할 정사각형 한 변의 최대 크기(px) */
const COVER_SIZE = 600;

/* =========================================================

let sb = null;             // Supabase 클라이언트
let tracks = [];           // 현재 화면에 표시/재생 중인 곡 목록
let allTracks = [];        // music 테이블 전체 곡
let currentIndex = 0;      // 현재 곡 인덱스
let selectedIndex = -1;    // 플레이리스트에서 한 번 클릭한 행

const $ = (id) => document.getElementById(id);
const el = {
  cd: $("cd"), cover: $("cover"),

  marquee: $("marquee"), marqueeText: $("marquee-text"),

/* 버튼 아이콘 (SVG 라서 어떤 폰트에서도 크기/모양이 같음) */
const ICON = {
  prev:  '<svg viewBox="0 0 16 12" aria-hidden="true"><rect x="1" y="0" width="2.5" height="12"/><path d="M14 0v12L5 6z"/></svg>',
  next:  '<svg viewBox="0 0 16 12" aria-hidden="true"><path d="M2 0v12l9-6z"/><rect x="12.5" y="0" width="2.5" height="12"/></svg>',
  play:  '<svg viewBox="0 0 16 12" aria-hidden="true"><path d="M4 0v12l10-6z"/></svg>',
  pause: '<svg viewBox="0 0 16 12" aria-hidden="true"><rect x="3" y="0" width="3.5" height="12"/><rect x="9.5" y="0" width="3.5" height="12"/></svg>',
};

/* =========================================================
 * 유틸
 * ========================================================= */
function fmt(sec) {                       // 초 → "mm:ss"
  sec = Math.max(0, Math.floor(sec || 0));
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}
function getYouTubeId(url) {              // 유튜브 URL → 11자리 영상 ID
  if (!url) return null;
  const m = String(url).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(String(url).trim()) ? String(url).trim() : null;
}
function pickOne(v) { return Array.isArray(v) ? v[0] : v; }   // 조인 결과가 배열이든 객체든 처리
function esc(s) {                         // HTML 이스케이프
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
/** Supabase 오류를 사람이 읽기 쉬운 문장으로 */
function explain(err) {
  const m = (err && err.message) || String(err);
  if (err && err.code === "23503") return "다른 데이터가 이 항목을 참조하고 있어서 처리할 수 없습니다.\n(예: 곡이 남아있는 가수/앨범은 삭제 전에 곡의 가수/앨범을 바꿔주세요)";
  if (/Bucket not found/i.test(m)) return `스토리지 버킷 "${STORAGE_BUCKET}" 이(가) 없습니다.\nSupabase → Storage 에서 Public 버킷을 만들어주세요.`;
  if (/row-level security/i.test(m)) return m + "\n(스토리지 업로드 정책 또는 RLS 설정을 확인하세요)";
  return m;
}

/* =========================================================
 * 1) 곡 데이터 조회 (music + artist + album 조인)
 * ========================================================= */
const MUSIC_SELECT = "id, name, youtube_url, artist(name), album(cover_url)";

/** music 행(조인 결과 포함) → 화면용 곡 객체 */
function mapMusic(row) {
  return {
    id: row.id,
    title: row.name,
    artist: pickOne(row.artist)?.name ?? "Unknown Artist",
    cover: pickOne(row.album)?.cover_url ?? "",
    videoId: getYouTubeId(row.youtube_url),
  };
}

async function fetchAllMusic() {
  const { data, error } = await sb.from("music").select(MUSIC_SELECT).order("id", { ascending: true });
  if (error) throw error;
  return (data || []).map(mapMusic);
}

/** 재생목록 하나의 곡들을 track_order 순서로 조회 (playlist_track → music → artist/album 중첩 조인) */
async function fetchPlaylistTracks(playlistId) {
  const { data, error } = await sb
    .from("playlist_track")
    .select("track_order, music(" + MUSIC_SELECT + ")")
    .eq("playlist_id", playlistId)
    .order("track_order", { ascending: true });
  if (error) throw error;
  return (data || []).map((r) => pickOne(r.music)).filter(Boolean).map(mapMusic);
}

/** playlist 테이블 → 드롭다운 (이전 선택을 최대한 유지) */
async function fillPlaylistSelect() {
  const prev = el.plSelect.value;
  const { data, error } = await sb.from("playlist").select("id, name").order("id", { ascending: true });
  if (error) throw error;
  el.plSelect.innerHTML = '<option value="all">All music</option>';
  (data || []).forEach((p) => {
    const opt = document.createElement("option");
    opt.value = p.id; opt.textContent = p.name;
    el.plSelect.appendChild(opt);
  });
  const exists = [...el.plSelect.options].some((o) => o.value === prev);
  el.plSelect.value = exists ? prev : "all";
}

/* =========================================================
 * 2) 플레이리스트 렌더링
 * ========================================================= */
function renderPlaylist() {
  if (!tracks.length) { el.playlist.innerHTML = '<div class="notice">곡이 없습니다. 우측 상단 [⚙ 관리]에서 추가하세요.</div>'; return; }
  el.playlist.innerHTML = tracks.map((t, i) => `
    <div class="row" data-i="${i}" role="option">
      <span class="no">${i + 1}.</span>
      <span class="nm">${esc(t.artist)} - ${esc(t.title)}</span>
    </div>`).join("");
  highlight();
}
function highlight() {
  el.playlist.querySelectorAll(".row").forEach((r) => {
    const i = Number(r.dataset.i);
    r.classList.toggle("current", i === currentIndex);
    r.classList.toggle("selected", i === selectedIndex && i !== currentIndex);
  });
  const cur = el.playlist.querySelector(".row.current");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
// 한 번 클릭 = 선택, 더블클릭 = 재생
el.playlist.addEventListener("click", (e) => {
  const row = e.target.closest(".row"); if (!row) return;
  selectedIndex = Number(row.dataset.i); highlight();
});
el.playlist.addEventListener("dblclick", (e) => {
  const row = e.target.closest(".row"); if (!row) return;
  errorStreak = 0; loadTrack(Number(row.dataset.i), true);
});

/* 재생목록 드롭다운 변경 */
el.plSelect.addEventListener("change", async () => {
  const wasPlaying = ytReady && player && player.getPlayerState() === YT.PlayerState.PLAYING;
  try {
    el.playlist.innerHTML = '<div class="notice">Loading playlist...</div>';
    const v = el.plSelect.value;
    const list = v === "all" ? allTracks : await fetchPlaylistTracks(v);
    tracks = list; currentIndex = 0; selectedIndex = -1;
    renderPlaylist();
    if (!tracks.length) {
      if (ytReady && player) player.stopVideo();
      setState("STOPPED", false); setMarquee("Empty playlist"); return;
    }
    errorStreak = 0; loadTrack(0, wasPlaying);
  } catch (err) {
    console.error(err);
    el.playlist.innerHTML = `<div class="notice">재생목록을 불러오지 못했습니다.<br>${esc(explain(err))}</div>`;
  }
});

/* =========================================================
 * 3) 전광판 / CD 표시
 * ========================================================= */

/** 전광판 문구 설정. 문구가 바뀔 때만 다시 계산하므로 흐르다가 초기화되지 않는다 */
function setMarquee(text) {
  if (text === lastMarquee) return;       // 같은 문구면 아무것도 안 함 (깜빡임/리셋 방지)
  lastMarquee = text;
  el.marqueeText.textContent = text;
  el.marquee.classList.remove("scroll");
  requestAnimationFrame(() => {
    const boxW = el.marquee.clientWidth, textW = el.marqueeText.offsetWidth;
    if (textW <= boxW) return;            // 짧은 글은 고정 표시
    el.marquee.style.setProperty("--from", boxW + "px");     // 오른쪽 끝에서 등장
    el.marquee.style.setProperty("--to", -textW + "px");     // 왼쪽 끝으로 퇴장
    el.marquee.style.setProperty("--dur", (boxW + textW) / 55 + "s");   // 일정 속도(55px/s)
    el.marquee.classList.add("scroll");
  });
}

/** 앨범 커버 표시. 주소 뒤에 아무것도 붙이지 않는다(리사이즈는 업로드 시점에 이미 끝남) */
function setCover(url) {
  const img = el.cover;
  img.onload = () => { img.style.visibility = "visible"; };
  img.onerror = () => { img.style.visibility = "hidden"; console.warn("앨범 커버 로드 실패:", url); };   // 실패하면 기본 CD 무늬가 보임
  img.style.visibility = "hidden";
  if (!url) { img.removeAttribute("src"); return; }
  img.src = url;
}

function showTrackInfo(t) {
  setMarquee(`${t.artist} - ${t.title}`);
  setCover(t.cover);
}
/** 재생 버튼 모양 갱신: 재생 중이면 일시정지(❚❚) 아이콘 + 눌린 상태, 아니면 재생(▶) 아이콘 */
function setPlayIcon(playing) {
  const b = $("btn-play");
  b.innerHTML = playing ? ICON.pause : ICON.play;
  b.classList.toggle("latched", playing);
  b.title = playing ? "일시정지" : "재생";
  b.setAttribute("aria-label", b.title);
}
function setState(label, spinning) {
  el.state.textContent = label;
  el.cd.classList.toggle("spinning", spinning);   // CD 회전 on/off
  setPlayIcon(spinning);
}

/* =========================================================
 * 4) 곡 로드 / 재생 (YouTube IFrame Player API)
 * ========================================================= */
function loadTrack(index, autoplay) {
  if (!tracks.length) return;
  currentIndex = (index + tracks.length) % tracks.length;   // 순환
  selectedIndex = -1;

  const t = tracks[currentIndex];
  showTrackInfo(t);
  highlight();
  el.time.textContent = "00:00";
  el.duration.textContent = "/ 00:00";
  el.seekFill.style.width = "0%";

  if (!ytReady || !player) { wantAutoplay = autoplay; return; }

  if (!t.videoId) {                       // 유튜브 주소가 잘못된 곡
    setState("BAD URL", false);
    if (autoplay && ++errorStreak < tracks.length) setTimeout(() => loadTrack(currentIndex + 1, true), 800);
    return;
  }
  if (autoplay) player.loadVideoById(t.videoId);
  else { player.cueVideoById(t.videoId); setState("STOPPED", false); }
}

function initFirstTrack() {
  if (!dataReady || !tracks.length) return;
  currentIndex = 0;
  if (!ytReady) { showTrackInfo(tracks[0]); highlight(); return; }
  loadTrack(0, false);
}

/** 유튜브 API 로드 완료 시 자동 호출되는 전역 콜백 */
function onYouTubeIframeAPIReady() {
  const vars = { playsinline: 1, controls: 0, disablekb: 1, rel: 0 };
  if (location.protocol.startsWith("http")) vars.origin = location.origin;   // file:// 이면 생략
  player = new YT.Player("yt-player", {
    width: "200", height: "200", playerVars: vars,
    events: {
      onReady: () => {
        ytReady = true;
        player.setVolume(volume);
        if (dataReady) loadTrack(currentIndex, wantAutoplay);
      },
      onStateChange: onPlayerStateChange,
      onError: onPlayerError,
    },
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

/** 유튜브 오류 코드 → 설명 */
function ytErrorText(code) {
  return ({
    2: "잘못된 영상 ID/주소",
    5: "HTML5 플레이어 오류",
    100: "영상을 찾을 수 없거나 비공개",
    101: "영상 소유자가 외부 재생을 허용하지 않음",
    150: "영상 소유자가 외부 재생을 허용하지 않음",
    153: "플레이어 설정 오류 - file:// 로 열었거나 Referer 가 차단됨. http(s) 주소로 여세요",
  })[code] || "알 수 없는 오류";
}

/** 재생 오류: 영상 자체 문제(100/101/150)만 다음 곡으로 건너뛰고, 연속 실패 시 멈춘다 */
function onPlayerError(e) {
  const code = e.data;
  console.warn("YouTube error", code, ytErrorText(code), tracks[currentIndex]);
  setState("ERROR " + code, false);
  stopTimer();
  const skippable = [100, 101, 150].includes(code);
  if (skippable && ++errorStreak < tracks.length) {
    setTimeout(() => loadTrack(currentIndex + 1, true), 1200);
  } else {
    setMarquee(`ERROR ${code}: ${ytErrorText(code)}`);   // 더 이상 넘어가지 않고 원인을 표시
  }
}

function onPlayerStateChange(e) {
  switch (e.data) {
    case YT.PlayerState.PLAYING:
      errorStreak = 0;
      setState("PLAYING", true); startTimer(); break;
    case YT.PlayerState.PAUSED:
      setState("PAUSED", false); stopTimer(); break;
    case YT.PlayerState.BUFFERING:
      el.state.textContent = "BUFFERING"; setPlayIcon(true); break;
    case YT.PlayerState.ENDED:
      setState("STOPPED", false); stopTimer();
      loadTrack(currentIndex + 1, true);        // 곡이 끝나면 자동으로 다음 곡
      break;
    case YT.PlayerState.CUED:
      setState("STOPPED", false); updateTime(); break;
  }
}

/* ---- 재생 시간 ---- */
function updateTime() {
  if (!player || !player.getCurrentTime) return;
  const cur = player.getCurrentTime(), dur = player.getDuration();
  el.time.textContent = fmt(cur);
  el.duration.textContent = "/ " + fmt(dur);
  el.seekFill.style.width = dur ? Math.min(100, (cur / dur) * 100) + "%" : "0%";
}
function startTimer() { stopTimer(); updateTime(); timerId = setInterval(updateTime, 250); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* =========================================================
 * 5) 미디어 버튼 / 볼륨 / 진행바
 * ========================================================= */
$("btn-prev").addEventListener("click", () => {
  errorStreak = 0;
  if (player && ytReady && player.getCurrentTime() > 3) { player.seekTo(0, true); return; }
  loadTrack(currentIndex - 1, true);
});
$("btn-next").addEventListener("click", () => { errorStreak = 0; loadTrack(currentIndex + 1, true); });
$("btn-play").addEventListener("click", () => {
  if (!player || !ytReady || !tracks.length) return;
  errorStreak = 0;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) { player.pauseVideo(); return; }   // 재생 중 → 일시정지
  if (selectedIndex >= 0 && selectedIndex !== currentIndex) { loadTrack(selectedIndex, true); return; }   // 선택해 둔 곡이 있으면 그 곡
  if (st === YT.PlayerState.PAUSED) player.playVideo();                                                   // 일시정지 → 이어서 재생
  else loadTrack(currentIndex, true);                                                                      // 정지/대기/오류 → 현재 곡 처음부터
});
// 버튼 아이콘 초기화
$("btn-prev").innerHTML = ICON.prev;
$("btn-next").innerHTML = ICON.next;
setPlayIcon(false);
/* ---- 옛날식 막대 볼륨 (막대 10개, 클릭/드래그/키보드 조작) ---- */
const VOL_BARS = 10;
el.vol.innerHTML = Array.from({ length: VOL_BARS }, (_, i) => `<i style="height:${((i + 1) / VOL_BARS) * 100}%"></i>`).join("");
function setVolume(v) {
  volume = Math.max(0, Math.min(100, Math.round(v)));
  const on = Math.round((volume / 100) * VOL_BARS);
  el.vol.querySelectorAll("i").forEach((b, i) => b.classList.toggle("on", i < on));
  el.vol.setAttribute("aria-valuenow", volume);
  if (player && ytReady) player.setVolume(volume);
}
function setVolFromPointer(e) {
  const r = el.vol.getBoundingClientRect();
  const n = Math.max(0, Math.min(VOL_BARS, Math.ceil(((e.clientX - r.left) / r.width) * VOL_BARS)));
  setVolume((n / VOL_BARS) * 100);
}
let volDrag = false;
el.vol.addEventListener("pointerdown", (e) => { volDrag = true; el.vol.setPointerCapture(e.pointerId); setVolFromPointer(e); });
el.vol.addEventListener("pointermove", (e) => { if (volDrag) setVolFromPointer(e); });
["pointerup", "pointercancel"].forEach((t) => el.vol.addEventListener(t, () => { volDrag = false; }));
el.vol.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { setVolume(volume + 10); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { setVolume(volume - 10); e.preventDefault(); }
});
setVolume(volume);
el.seek.addEventListener("click", (e) => {
  if (!player || !ytReady) return;
  const dur = player.getDuration(); if (!dur) return;
  const r = el.seek.getBoundingClientRect();
  player.seekTo(dur * ((e.clientX - r.left) / r.width), true); updateTime();
});

/* =========================================================
 * 6) 편집 후 화면 데이터 새로고침 (재생 중인 곡은 최대한 유지)
 * ========================================================= */
async function refreshData() {
  const curId = tracks[currentIndex]?.id;
  allTracks = await fetchAllMusic();
  await fillPlaylistSelect();
  const v = el.plSelect.value;
  tracks = v === "all" ? allTracks : await fetchPlaylistTracks(v);
  selectedIndex = -1;
  dataReady = true;
  renderPlaylist();
  if (!tracks.length) {
    if (ytReady && player) player.stopVideo();
    setState("STOPPED", false); setMarquee("No tracks"); setCover("");
    return;
  }
  const idx = tracks.findIndex((t) => t.id === curId);
  if (idx >= 0) { currentIndex = idx; showTrackInfo(tracks[idx]); highlight(); }   // 재생은 끊지 않음
  else { errorStreak = 0; loadTrack(0, false); }
}

/* =========================================================
 * 7) 앨범 커버 업로드 (업로드 전에 정사각형으로 잘라서 리사이즈)
 * ========================================================= */
async function resizeToSquare(file) {
  const bmp = await createImageBitmap(file);
  const side = Math.min(bmp.width, bmp.height);          // 가운데 기준 정사각형으로 자르기(cover)
  const sx = (bmp.width - side) / 2, sy = (bmp.height - side) / 2;
  const size = Math.min(COVER_SIZE, side);               // 원본보다 키우지는 않음
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(bmp, sx, sy, side, side, 0, 0, size, size);
  return new Promise((res, rej) =>
    canvas.toBlob((b) => (b ? res(b) : rej(new Error("이미지 변환에 실패했습니다."))), "image/jpeg", 0.88));
}
async function uploadCover(file) {
  const blob = await resizeToSquare(file);
  const path = `album_${Date.now()}_${Math.random().toString(36).slice(2, 8)}.jpg`;   // 파일명은 영문/숫자만
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

/* =========================================================
 * 8) 관리(CRUD) 창
 *    - 곡 / 앨범 / 가수 / 재생목록 : 같은 코드로 추가·수정·삭제 (SCHEMA 설정 기반)
 *    - 재생목록 곡 구성(playlist_track) : 곡 추가, 순서 변경(▲▼), 삭제
 * ========================================================= */
const SCHEMA = {
  music: {
    label: "곡", select: "id, name, youtube_url, artist_id, album_id, artist(name), album(name)",
    fields: [
      { key: "name", label: "곡 제목", type: "text", required: true },
      { key: "youtube_url", label: "유튜브 URL", type: "text", required: true },
      { key: "artist_id", label: "가수", type: "ref", ref: "artist" },
      { key: "album_id", label: "앨범", type: "ref", ref: "album" },
    ],
    title: (r) => r.name,
    sub: (r) => `${pickOne(r.artist)?.name ?? "-"} · ${pickOne(r.album)?.name ?? "-"}`,
  },
  album: {
    label: "앨범", select: "id, name, cover_url, artist_id, artist(name)",
    fields: [
      { key: "name", label: "앨범 이름", type: "text", required: true },
      { key: "artist_id", label: "가수", type: "ref", ref: "artist" },
      { key: "cover_url", label: "커버 이미지", type: "image" },
    ],
    title: (r) => r.name, sub: (r) => pickOne(r.artist)?.name ?? "-", thumb: (r) => r.cover_url,
  },
  artist: {
    label: "가수", select: "id, name",
    fields: [{ key: "name", label: "가수 이름", type: "text", required: true }],
    title: (r) => r.name, sub: () => "",
  },
  playlist: {
    label: "재생목록", select: "id, name",
    fields: [{ key: "name", label: "재생목록 이름", type: "text", required: true }],
    title: (r) => r.name, sub: () => "",
  },
};

const mgr = { tab: "music", editingId: null, rows: [], refs: {}, dirty: false, trackPl: null, playlists: [], musicList: [], trackRows: [] };
const mgrBody = $("mgr-body");

function mgrMsg(text, isErr) {
  const m = $("mgr-msg"); if (!m) return;
  m.textContent = text || ""; m.classList.toggle("err", !!isErr);
}

/* ---- 열기 / 닫기 ---- */
$("btn-manage").addEventListener("click", () => {
  if (!sb) return;
  $("modal").hidden = false; mgr.dirty = false; openTab(mgr.tab);
});
function closeModal() {
  $("modal").hidden = true;
  if (mgr.dirty) { mgr.dirty = false; refreshData().catch((e) => console.error(e)); }   // 바뀐 내용이 있으면 화면 갱신
}
$("btn-close").addEventListener("click", closeModal);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });

/* ---- 탭 ---- */
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (b) openTab(b.dataset.tab);
});

async function openTab(tab) {
  mgr.tab = tab; mgr.editingId = null;
  document.querySelectorAll("#tabs .tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  mgrBody.innerHTML = '<div class="empty">Loading...</div>';
  try {
    if (tab === "tracks") { await loadTracksTab(); return; }
    const cfg = SCHEMA[tab];
    // 참조(select) 필드용 목록 (가수/앨범)
    for (const f of cfg.fields.filter((f) => f.type === "ref")) {
      const { data, error } = await sb.from(f.ref).select("id, name").order("id");
      if (error) throw error;
      mgr.refs[f.ref] = data || [];
    }
    const { data, error } = await sb.from(tab).select(cfg.select).order("id", { ascending: true });
    if (error) throw error;
    mgr.rows = data || [];
    drawCrud();
  } catch (err) {
    mgrBody.innerHTML = `<div class="card"><div class="msg err">${esc(explain(err))}</div></div>`;
  }
}

/* ---- 일반 CRUD 화면 ---- */
function drawCrud() {
  const cfg = SCHEMA[mgr.tab];
  const editing = mgr.rows.find((r) => r.id === mgr.editingId) || null;

  const fields = cfg.fields.map((f) => {
    const val = editing ? editing[f.key] : null;
    if (f.type === "text")
      return `<label class="fld"><span>${f.label}</span><input type="text" name="${f.key}" value="${esc(val ?? "")}" ${f.required ? "required" : ""} autocomplete="off"></label>`;
    if (f.type === "ref") {
      const opts = (mgr.refs[f.ref] || []).map((o) =>
        `<option value="${o.id}" ${String(o.id) === String(val) ? "selected" : ""}>${esc(o.name)}</option>`).join("");
      return `<label class="fld"><span>${f.label}</span><select name="${f.key}"><option value="">(없음)</option>${opts}</select></label>`;
    }
    if (f.type === "image")
      return `<div class="fld"><span>${f.label} (올리면 자동으로 정사각형 리사이즈 후 저장${editing ? " / 선택 안 하면 기존 이미지 유지" : ""})</span>
        <div class="img-row"><img class="thumb big" id="img-preview" alt="" ${val ? `src="${esc(val)}"` : 'style="visibility:hidden"'}>
        <input type="file" name="${f.key}" accept="image/*"></div></div>`;
    return "";
  }).join("");

  const list = mgr.rows.map((r) => `
    <div class="item ${r.id === mgr.editingId ? "sel" : ""}">
      ${cfg.thumb ? `<img class="thumb" src="${esc(cfg.thumb(r) || "")}" alt="" onerror="this.style.visibility='hidden'">` : ""}
      <div class="grow"><b>${esc(cfg.title(r))}</b><small>${esc(cfg.sub(r))}</small></div>
      <button class="wbtn" data-act="edit" data-id="${r.id}">수정</button>
      <button class="wbtn danger" data-act="del" data-id="${r.id}">삭제</button>
    </div>`).join("") || '<div class="empty">아직 데이터가 없습니다.</div>';

  mgrBody.innerHTML = `
    <form id="crud-form" class="card">
      <h3>${cfg.label} ${editing ? "수정" : "추가"}</h3>
      ${fields}
      <div class="btns">
        <button class="wbtn" type="submit" id="save-btn">${editing ? "저장" : "추가"}</button>
        ${editing ? '<button class="wbtn" type="button" data-act="cancel">취소</button>' : ""}
      </div>
      <div class="msg" id="mgr-msg"></div>
    </form>
    <div class="list">${list}</div>`;
}

/* 이미지 선택 시 미리보기 */
mgrBody.addEventListener("change", (e) => {
  if (e.target.type === "file" && e.target.files[0]) {
    const p = $("img-preview");
    if (p) { p.src = URL.createObjectURL(e.target.files[0]); p.style.visibility = "visible"; }
  }
  if (e.target.id === "trk-pl") { mgr.trackPl = Number(e.target.value); drawTracks().catch((er) => mgrMsg(explain(er), true)); }
});

/* 저장 (추가/수정) */
mgrBody.addEventListener("submit", async (e) => {
  if (e.target.id !== "crud-form") return;
  e.preventDefault();
  const cfg = SCHEMA[mgr.tab], form = e.target, btn = $("save-btn");
  btn.disabled = true; mgrMsg("저장 중...");
  try {
    const payload = {};
    for (const f of cfg.fields) {
      const input = form.elements[f.key];
      if (f.type === "text") payload[f.key] = input.value.trim();
      else if (f.type === "ref") payload[f.key] = input.value ? Number(input.value) : null;
      else if (f.type === "image" && input.files[0]) {
        mgrMsg("이미지 리사이즈 및 업로드 중...");
        payload[f.key] = await uploadCover(input.files[0]);   // 파일을 고른 경우에만 값 변경
      }
    }
    if (mgr.tab === "music" && !getYouTubeId(payload.youtube_url)) throw new Error("올바른 유튜브 주소가 아닙니다.");

    const q = mgr.editingId
      ? sb.from(mgr.tab).update(payload).eq("id", mgr.editingId)
      : sb.from(mgr.tab).insert(payload);
    const { error } = await q;
    if (error) throw error;

    const wasEdit = !!mgr.editingId;
    mgr.dirty = true;
    await openTab(mgr.tab);
    mgrMsg(wasEdit ? "수정되었습니다." : "추가되었습니다.");
  } catch (err) {
    console.error(err);
    btn.disabled = false; mgrMsg(explain(err), true);
  }
});

/* 클릭 이벤트 (수정/삭제/취소/트랙 조작) */
mgrBody.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const act = btn.dataset.act, id = btn.dataset.id ? Number(btn.dataset.id) : null;
  try {
    if (act === "edit") { mgr.editingId = id; drawCrud(); mgrBody.scrollTop = 0; }
    else if (act === "cancel") { mgr.editingId = null; drawCrud(); }
    else if (act === "del") await deleteRow(id);
    else if (act === "trk-add") await addTrack();
    else if (act === "up") await moveTrack(id, -1);
    else if (act === "down") await moveTrack(id, +1);
    else if (act === "rm") await removeTrack(id);
  } catch (err) { console.error(err); mgrMsg(explain(err), true); }
});

async function deleteRow(id) {
  const warn = { music: "이 곡이 들어있는 재생목록 항목도 함께 삭제됩니다.", playlist: "이 재생목록의 곡 구성도 함께 삭제됩니다." }[mgr.tab] || "";
  if (!confirm(`정말 삭제할까요?\n${warn}`)) return;
  // 연결된 playlist_track 을 먼저 정리 (외래키 오류 방지)
  if (mgr.tab === "music") { const r = await sb.from("playlist_track").delete().eq("music_id", id); if (r.error) throw r.error; }
  if (mgr.tab === "playlist") { const r = await sb.from("playlist_track").delete().eq("playlist_id", id); if (r.error) throw r.error; }
  const { error } = await sb.from(mgr.tab).delete().eq("id", id);
  if (error) throw error;
  mgr.dirty = true;
  await openTab(mgr.tab);
  mgrMsg("삭제되었습니다.");
}

/* ---- 재생목록 곡 구성 (playlist_track) ---- */
async function loadTracksTab() {
  const [pl, mu] = await Promise.all([
    sb.from("playlist").select("id, name").order("id"),
    sb.from("music").select("id, name, artist(name)").order("id"),
  ]);
  if (pl.error) throw pl.error;
  if (mu.error) throw mu.error;
  mgr.playlists = pl.data || []; mgr.musicList = mu.data || [];
  if (!mgr.playlists.some((p) => p.id === mgr.trackPl)) mgr.trackPl = mgr.playlists[0]?.id ?? null;
  await drawTracks();
}

async function drawTracks() {
  if (!mgr.playlists.length) { mgrBody.innerHTML = '<div class="empty">먼저 [재생목록] 탭에서 재생목록을 만들어주세요.</div>'; return; }
  const { data, error } = await sb.from("playlist_track")
    .select("id, track_order, music(id, name, artist(name))")
    .eq("playlist_id", mgr.trackPl).order("track_order", { ascending: true });
  if (error) throw error;
  mgr.trackRows = data || [];

  const plOpts = mgr.playlists.map((p) => `<option value="${p.id}" ${p.id === mgr.trackPl ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const muOpts = mgr.musicList.map((m) => `<option value="${m.id}">${esc(pickOne(m.artist)?.name ?? "-")} - ${esc(m.name)}</option>`).join("");
  const rows = mgr.trackRows.map((r, i) => {
    const m = pickOne(r.music);
    return `<div class="item">
      <span class="no">${i + 1}</span>
      <div class="grow"><b>${esc(m?.name ?? "(삭제된 곡)")}</b><small>${esc(pickOne(m?.artist)?.name ?? "")}</small></div>
      <button class="wbtn" data-act="up" data-id="${r.id}" ${i === 0 ? "disabled" : ""}>▲</button>
      <button class="wbtn" data-act="down" data-id="${r.id}" ${i === mgr.trackRows.length - 1 ? "disabled" : ""}>▼</button>
      <button class="wbtn danger" data-act="rm" data-id="${r.id}">삭제</button>
    </div>`;
  }).join("") || '<div class="empty">이 재생목록에는 아직 곡이 없습니다.</div>';

  mgrBody.innerHTML = `
    <div class="card">
      <label class="fld"><span>재생목록 선택</span><select id="trk-pl">${plOpts}</select></label>
      <label class="fld"><span>추가할 곡</span><select id="trk-music">${muOpts || "<option value=''>(곡이 없습니다)</option>"}</select></label>
      <div class="btns"><button class="wbtn" data-act="trk-add">+ 이 재생목록에 추가</button></div>
      <div class="msg" id="mgr-msg"></div>
    </div>
    <div class="list">${rows}</div>`;
}

async function addTrack() {
  const musicId = Number($("trk-music").value);
  if (!musicId) throw new Error("추가할 곡을 선택하세요.");
  const next = mgr.trackRows.reduce((mx, r) => Math.max(mx, r.track_order || 0), 0) + 1;   // 맨 뒤에 추가
  const { error } = await sb.from("playlist_track").insert({ playlist_id: mgr.trackPl, music_id: musicId, track_order: next });
  if (error) throw error;
  mgr.dirty = true; await drawTracks(); mgrMsg("추가되었습니다.");
}

async function moveTrack(id, dir) {
  const rows = mgr.trackRows.slice();
  const i = rows.findIndex((r) => r.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  [rows[i], rows[j]] = [rows[j], rows[i]];
  // 1..n 으로 순서를 다시 매기고, 값이 달라진 행만 업데이트 (중복/빈 순번도 함께 정리됨)
  const jobs = rows.map((r, idx) => (r.track_order === idx + 1 ? null : sb.from("playlist_track").update({ track_order: idx + 1 }).eq("id", r.id))).filter(Boolean);
  const results = await Promise.all(jobs);
  const bad = results.find((r) => r.error); if (bad) throw bad.error;
  mgr.dirty = true; await drawTracks();
}

async function removeTrack(id) {
  const { error } = await sb.from("playlist_track").delete().eq("id", id);
  if (error) throw error;
  mgr.dirty = true; await drawTracks(); mgrMsg("삭제되었습니다.");
}

/* =========================================================
 * 9) 시작
 * ========================================================= */
(async function boot() {
  // file:// 로 열면 유튜브가 재생을 막으므로 안내 표시
  if (location.protocol === "file:") $("env-warn").hidden = false;

  // 유튜브 IFrame API 로드
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  try {
    // 실수로 .../rest/v1/ 까지 붙여 넣어도 자동으로 제거
    const url = SUPABASE_URL.replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, "");
    sb = supabase.createClient(url, SUPABASE_ANON_KEY);

    allTracks = await fetchAllMusic();      // 최우선: music + artist + album 조인
    tracks = allTracks;
    dataReady = true;
    renderPlaylist();
    if (tracks.length) initFirstTrack();
    else { setMarquee("No tracks"); }

    fillPlaylistSelect().catch((e) => console.error("Playlist load error:", e));
  } catch (err) {
    console.error("Supabase error:", err);
    el.playlist.innerHTML = `<div class="notice">데이터를 불러오지 못했습니다.<br>${esc(explain(err))}</div>`;
    setMarquee("Supabase connection error");
  }
})();
</script>
</body>
</html>
